services:
  - type: web
    name: pitchrank-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -e ./backend && bash deploy/build-render.sh
    startCommand: bash deploy/start-render.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: PITCHRANK_SEASON
        value: "2026-2027"
      - key: PITCHRANK_PUBLIC
        value: "1"
      - key: PITCHRANK_DAILY_REFRESH
        value: "0"
      - key: PITCHRANK_CORS_ORIGINS
        sync: false
      - key: PITCHRANK_SEED_URL
        sync: false
      - key: PITCHRANK_SEED_SHA256
        sync: false
