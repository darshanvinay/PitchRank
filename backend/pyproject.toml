[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchrank"
version = "0.1.0"
description = "Premier League data and Elo analytics"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pandas>=2.2,<4", "pydantic>=2.7,<3", "numpy>=2.0,<3", "fastapi>=0.115,<0.116", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1"]
analysis = ["scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.scripts]
pitchrank = "app.ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
